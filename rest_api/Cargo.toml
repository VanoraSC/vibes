[package]
name = "rest_api"
version = "0.1.0"
edition = "2024"

[dependencies]
poem = { version = "1.3", features = ["test"] }
poem-openapi = { version = "1.3", features = ["swagger-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
